[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "repo-workbench-agent"
version = "0.1.0"
description = "A bounded, inspectable coding agent for local repository tasks"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "fastapi>=0.110", "uvicorn>=0.27"]
[project.scripts]
repo-agent = "repo_agent.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
repo_agent = ["static/*.html", "skills/*/SKILL.md"]
