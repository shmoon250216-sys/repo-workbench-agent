<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repo Workbench</title>
<style>
:root{--ink:#18362f;--muted:#697d76;--line:#dce6df;--green:#146e54}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font:14px/1.65 "Microsoft YaHei",sans-serif}header{background:white;border-bottom:1px solid var(--line);padding:23px 4vw;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:bold}.small{font-size:12px;color:var(--muted)}main{max-width:1450px;margin:auto;padding:28px}.intro{margin-bottom:22px}h1{font-size:28px;margin:0 0 6px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:18px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}textarea,input{width:100%;font:inherit;border:1px solid var(--line);border-radius:7px;padding:10px}textarea{height:145px;resize:vertical}button{font:inherit;cursor:pointer;background:white;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 12px;margin:5px 6px 5px 0}.primary{background:var(--green);color:white;border-color:var(--green)}button:disabled{opacity:.5}.task{display:block;text-align:left;width:100%;overflow-wrap:anywhere}.event{border-left:2px solid var(--line);padding:8px 12px;margin:10px 0}.event strong{display:block}.badge{background:#e8f2ea;padding:5px 9px;border-radius:6px}.notice{padding:12px;background:#fff5df;border-radius:7px;white-space:pre-wrap;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.6 Consolas,monospace;background:#f5f7f4;padding:12px;border-radius:7px;max-height:350px;overflow:auto}#events{max-height:650px;overflow:auto}#final{white-space:pre-wrap;overflow-wrap:anywhere}#workspace{max-width:700px;overflow-wrap:anywhere}details{margin:8px 0}footer{margin-top:20px;color:var(--muted)}.hide{display:none}@media(max-width:1150px){.grid{grid-template-columns:240px minmax(0,1fr)}.review{grid-column:1/-1}}@media(max-width:650px){main{padding:15px}.grid{grid-template-columns:1fr}.review{grid-column:auto}header{display:block}.brand{font-size:20px}}
</style>
<header><div><div class="brand">Repo Workbench</div><div class="small">LOCAL REPOSITORY DEVELOPMENT AGENT</div></div><span id="mode" class="badge">连接本地工作区</span></header>
<main><div class="intro"><h1>从任务到可审查的修改</h1><div id="workspace" class="small">代码理解 · 功能开发 · 缺陷修复 · 测试验证</div></div>
<div id="login" class="panel"><input id="credential" type="password" placeholder="粘贴本地启动凭据"><button id="connect" class="primary">连接</button></div><div id="notice" class="notice hide"></div>
<div class="grid"><aside class="panel"><h2>开发任务</h2><textarea id="task" placeholder="例如：定位分页边界问题，提出修改并运行测试。"></textarea><button id="create" class="primary">创建任务</button><button id="follow">追加到当前会话</button><h2 style="margin-top:20px">会话记录</h2><div id="sessions"></div></aside>
<section class="panel"><h2 id="title">选择或创建任务</h2><div><span id="status" class="badge">就绪</span><button id="run">运行 / 继续</button><button id="stop">停止</button></div><div id="stats" class="small"></div><h2 style="margin-top:20px">执行轨迹</h2><div id="events"></div><h2 style="margin-top:20px">最终答复</h2><div id="final" class="small">执行结果将在这里显示。</div></section>
<aside class="panel review"><h2>修改与执行审核</h2><div class="small">核对差异和执行后端后批准；批准决定由操作人提交，模型无权自行授权。</div><div id="approvals"></div></aside></div><footer>模型答复与工具验收分别展示。离线脚本用于验证机制，不代表真实模型任务成功率。</footer></main>
<script>
const $=id=>document.getElementById(id);let token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('repo-token')||'',sid='',selected=null;history.replaceState(null,'',location.pathname);let signature='';
function node(tag,text,cls){let n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function notice(text){$('notice').textContent=text;$('notice').classList.toggle('hide',!text)}
async function api(path,body){const r=await fetch('/api'+path,{method:body?'POST':'GET',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok)throw Error(typeof v.detail==='string'?v.detail:'请求未通过校验');return v}
async function connect(){const c=await api('/config');sessionStorage.setItem('repo-token',token);$('login').classList.add('hide');$('workspace').textContent=c.workspace+' · 测试后端：'+c.backend;$('mode').textContent=c.mode==='offline-scripted'?'离线脚本演示':'真实模型 · '+c.model;if(c.mode==='offline-scripted')notice('当前为确定性演示，仅操作示例 calculator.py；真实任务请启动 live 模式。');await list()}
async function list(){const rows=await api('/sessions');$('sessions').replaceChildren();for(const s of rows){const b=node('button',s.task,'task');b.onclick=()=>{sid=s.id;signature='';refresh().catch(e=>notice(e.message))};$('sessions').append(b)}}
async function refresh(){if(!sid)return;const s=await api('/sessions/'+sid);selected=s;const sig=JSON.stringify(s);if(sig===signature)return;signature=sig;$('title').textContent=s.task;$('status').textContent=s.status;$('stats').textContent='模型步骤 '+s.steps+'/'+s.max_steps+' · API tokens '+s.usage_tokens+' · 实际测试状态 '+s.verification+' · 上下文裁剪次数 '+s.compression_count;$('run').disabled=s.status==='running';$('final').textContent=s.final||'尚未结束';$('events').replaceChildren();for(const e of s.events){const item=node('div',undefined,'event');item.append(node('strong',e.kind+(e.data.tool?' · '+e.data.tool:'')));const detail=node('details');detail.append(node('summary',new Date(e.created*1000).toLocaleTimeString()),node('pre',JSON.stringify(e.data,null,2)));item.append(detail);$('events').append(item)}$('approvals').replaceChildren();for(const a of s.approvals){const item=node('div');item.append(node('h2',a.kind==='edit'?'文件修改 · '+a.data.path:'测试执行 · '+a.data.backend),node('pre',a.data.diff||JSON.stringify(a.data,null,2)));if(a.decision==='pending'){for(const [label,allow]of [['批准',true],['拒绝',false]]){const b=node('button',label,allow?'primary':'');b.onclick=async()=>{try{await api('/sessions/'+sid+'/approvals/'+a.id,{allow});await refresh()}catch(e){notice(e.message)}};item.append(b)}}else item.append(node('div',a.decision,'small'));$('approvals').append(item)}}
$('follow').onclick=async()=>{if(!sid)return notice('请先选择会话');try{await api('/sessions/'+sid+'/follow-up',{task:$('task').value,max_steps:20});await refresh()}catch(e){notice(e.message)}};
$('stop').onclick=()=>{if(sid)api('/sessions/'+sid+'/stop',{}).catch(e=>notice(e.message))};
$('connect').onclick=()=>{token=$('credential').value;connect().catch(e=>notice(e.message))};$('create').onclick=async()=>{try{const s=await api('/sessions',{task:$('task').value,max_steps:20});sid=s.id;await list();await refresh()}catch(e){notice(e.message)}};$('run').onclick=async()=>{if(!sid)return;try{$('run').disabled=true;await api('/sessions/'+sid+'/run',{});await refresh()}catch(e){notice(e.message)}};if(token)connect().catch(e=>notice(e.message));setInterval(()=>{if(token&&sid)refresh().catch(()=>{})},1200);
</script></html>
